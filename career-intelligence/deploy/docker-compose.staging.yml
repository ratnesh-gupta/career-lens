# Staging stack on EC2 (app processes). Postgres/Redis/S3 may be managed AWS services.
# Copy to server as docker-compose.yml next to a populated .env.staging

services:
  api:
    image: careerlens-api:staging
    build:
      context: ../apps/api
      dockerfile: ../../deploy/docker/Dockerfile.api
    env_file: .env.staging
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: careerlens-api:staging
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    env_file: .env.staging
    restart: unless-stopped
    depends_on:
      - redis
      - api

  web:
    image: careerlens-web:staging
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.staging.example.com/api/v1}
        VITE_ENABLE_MSW: "false"
        VITE_APP_URL: ${VITE_APP_URL:-https://staging.example.com}
    ports:
      - "8080:80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - staging_redis:/data

volumes:
  staging_redis:
